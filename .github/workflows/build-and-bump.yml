# Reusable: build an image ONCE, push it to ghcr.io/<repo owner>/<image> (the caller's own namespace,
# with the caller's own GITHUB_TOKEN), then commit the new digest into sijiltech/munjez-infra
# (stacks/staging/<stack>/compose.yaml). Komodo deploys it.
#
# Caller (in an app repo, branch staging):
#   jobs:
#     release:
#       uses: sijiltech/munjez-ci/.github/workflows/build-and-bump.yml@<commit sha>   # public repo; pin to a SHA (zizmor)
#       with: { image: admin-web, stack: admin-web-staging }
#       secrets:   # cross-account callers cannot use `secrets: inherit`
#         MUNJEZ_DEPLOYER_APP_ID: ${{ secrets.MUNJEZ_DEPLOYER_APP_ID }}
#         MUNJEZ_DEPLOYER_PRIVATE_KEY: ${{ secrets.MUNJEZ_DEPLOYER_PRIVATE_KEY }}
#       permissions: { contents: read, packages: write }
#
# Repo secrets (free plan: org secrets do not reach private repos): MUNJEZ_DEPLOYER_APP_ID,
# MUNJEZ_DEPLOYER_PRIVATE_KEY (GitHub App "sijiltech-deployer", installed ONLY on munjez-infra,
# Contents + Pull requests write). One App private key per account owner, so each can be revoked alone.
name: build-and-bump

on:
  workflow_call:
    inputs:
      image:        { type: string, required: true,  description: "image name under ghcr.io/<repo owner>/" }
      stack:        { type: string, required: true,  description: "folder under stacks/staging/ in munjez-infra" }
      context:      { type: string, required: false, default: "." }
      dockerfile:   { type: string, required: false, default: "Dockerfile" }
      build-args:   { type: string, required: false, default: "" }
      runs-on:      { type: string, required: false, default: '"ubuntu-latest"', description: "JSON label or list" }
      bump:         { type: boolean, required: false, default: true, description: "false = build/push only" }
    secrets:
      MUNJEZ_DEPLOYER_APP_ID:      { required: false }
      MUNJEZ_DEPLOYER_PRIVATE_KEY: { required: false }
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
      ref:
        value: ${{ jobs.build.outputs.ref }}

permissions: {}

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push to ghcr.io/<owner>/* with the repo's own GITHUB_TOKEN (no PAT)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      ref: ${{ steps.ref.outputs.name }}
    steps:
      - id: ref                # GHCR names must be lowercase (MasoudOps -> masoudops)
        shell: bash
        env: { IMAGE: "${{ inputs.image }}" }
        run: |
          [[ "$IMAGE" =~ ^[a-z0-9._/-]+$ ]] || { echo "bad image name"; exit 1; }
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: true
          # Immutable tag per commit; deploys reference the DIGEST, never a tag.
          tags: ${{ steps.ref.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
      - name: Summary
        shell: bash
        env: { DIGEST: "${{ steps.push.outputs.digest }}", REF: "${{ steps.ref.outputs.name }}" }
        run: echo "pushed ${REF}@${DIGEST} (tag sha-${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"

  bump:
    if: inputs.bump
    needs: build
    uses: sijiltech/munjez-ci/.github/workflows/gitops-bump.yml@bc11b8f44b07d54b71086ba8067144c997527ade  # main 2026-10-28
    with:
      ref: ${{ needs.build.outputs.ref }}@${{ needs.build.outputs.digest }}
      stack: ${{ inputs.stack }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      MUNJEZ_DEPLOYER_APP_ID: ${{ secrets.MUNJEZ_DEPLOYER_APP_ID }}
      MUNJEZ_DEPLOYER_PRIVATE_KEY: ${{ secrets.MUNJEZ_DEPLOYER_PRIVATE_KEY }}
    permissions: {}
